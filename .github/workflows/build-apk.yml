name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Xbox Controller APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Licenses and Platform 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup and Synchronize Android Platform
        run: |
          # If the repository is missing gradlew or the android wrapper, regenerate it
          if [ ! -f "android/gradlew" ] || [ ! -f "android/settings.gradle" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Incomplete android directory detected. Regenerating complete Android platform with Capacitor..."
            rm -rf android
            npx cap add android
          fi

          # Ensure SDK 35 compatibility
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle
          fi

          # Ensure safe google-services check in app/build.gradle
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/servicesJSON.text/servicesJSON.exists()/g' android/app/build.gradle
          fi

          # Ensure reliable gradle wrapper
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/-all.zip/-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
            if ! grep -q "networkTimeout" android/gradle/wrapper/gradle-wrapper.properties; then
              echo "networkTimeout=60000" >> android/gradle/wrapper/gradle-wrapper.properties
            fi
          fi

          # Synchronize Capacitor assets
          npx cap sync android

          # Ensure gradlew has execute permissions
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Collect APK
        run: |
          mkdir -p release-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*debug*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android -name "*.apk" ! -name "*unaligned*" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK was generated by the build process!"
            exit 1
          fi
          echo "Successfully generated APK: $APK_FILE"
          cp "$APK_FILE" release-output/XstreamPad-Xbox-Roblox.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XstreamPad-Xbox-Roblox-APK
          path: release-output/XstreamPad-Xbox-Roblox.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ format('XstreamPad Xbox Controller APK v1.0.{0}', github.run_number) }}
          body: |
            ### 🎮 XstreamPad - Xbox Controller APK for Airtel Xstream & Roblox TV
            Download `XstreamPad-Xbox-Roblox.apk` below and install it directly on your Android phone!
            
            #### ✨ Highlights:
            - **Auto-Rotates to Landscape**: Immediately locks into landscape mode on launch.
            - **Authentic Xbox Controller Layout**: Asymmetric thumbsticks, Xbox colored ABXY buttons, Xbox Guide/Nexus button, View & Menu buttons.
            - **Roblox Obby Ready**: Dedicated A/Spacebar jump, camera orbit right stick, inventory, and quick emote wheel.
            - **Ultra-low Latency**: Direct WebRTC / WebSocket link to your Airtel Xstream TV box.
            - **Tactile Rumble**: Mechanical click audio feedback and multi-pulse haptics.
          files: release-output/XstreamPad-Xbox-Roblox.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
