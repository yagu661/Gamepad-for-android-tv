name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Xbox Controller APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/XstreamPad-Xbox-Roblox.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XstreamPad-Xbox-Roblox-APK
          path: release-output/XstreamPad-Xbox-Roblox.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ format('XstreamPad Xbox Controller APK v1.0.{0}', github.run_number) }}
          body: |
            ### 🎮 XstreamPad - Xbox Style Controller for Airtel Xstream & Roblox TV
            
            Download the Android APK below and install it directly on your Android phone!
            
            #### 📦 Download:
            - **`XstreamPad-Xbox-Roblox.apk`** (Ready to install on Android phones)
            
            #### ✨ Highlights:
            - **Authentic Xbox Controller Layout**: Asymmetric thumbsticks, Xbox colored ABXY buttons, Xbox Guide/Nexus button, View & Menu buttons.
            - **Roblox Obby Ready**: Dedicated A/Spacebar jump, camera orbit right stick, inventory, and quick emote wheel.
            - **Ultra-low Latency**: Direct WebRTC / WebSocket link to your Airtel Xstream TV box.
            - **Tactile Rumble**: Mechanical click audio feedback and multi-pulse haptics.
          files: release-output/XstreamPad-Xbox-Roblox.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
