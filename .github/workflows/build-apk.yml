name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Xbox Controller APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup and Synchronize Android Platform
        run: |
          if [ ! -f "android/gradlew" ] || \
             [ ! -f "android/settings.gradle" ] || \
             [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then

            echo "Android platform incomplete. Regenerating..."
            rm -rf android
            npx cap add android
          fi

          # Set compile SDK to 36
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' android/variables.gradle
          fi

          # Fix Google services check
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/servicesJSON.text/servicesJSON.exists()/g' android/app/build.gradle
          fi

          # Force Gradle 8.13
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-[0-9.]*-\(all\|bin\)\.zip/gradle-8.13-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties

            if ! grep -q "networkTimeout" android/gradle/wrapper/gradle-wrapper.properties; then
              echo "networkTimeout=60000" >> android/gradle/wrapper/gradle-wrapper.properties
            fi
          fi

          # Synchronize Capacitor
          npx cap sync android

          chmod +x android/gradlew

          # Verify Gradle wrapper version
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Collect APK
        run: |
          mkdir -p release-output

          APK_FILE=$(find android/app/build/outputs/apk \
            -name "*debug*.apk" \
            ! -name "*unaligned*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK was generated!"
            find android -name "*.apk"
            exit 1
          fi

          echo "APK successfully generated: $APK_FILE"

          cp "$APK_FILE" release-output/XstreamPad-Xbox-Roblox.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XstreamPad-Xbox-Roblox-APK
          path: release-output/XstreamPad-Xbox-Roblox.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: XstreamPad Xbox Controller APK v1.0.${{ github.run_number }}
          body: |
            # XstreamPad Xbox Controller

            Download the Android APK below.

            Features:
            - Xbox-style controller layout
            - Landscape orientation
            - Roblox gamepad controls
            - Touch feedback and haptics
          files: release-output/XstreamPad-Xbox-Roblox.apk
