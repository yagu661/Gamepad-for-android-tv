name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Xbox Controller APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Tools & Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      - name: Install npm dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Ensure Complete Capacitor Android Platform
        run: |
          # If gradlew or settings.gradle is missing from the repository, recreate the complete platform
          if [ ! -f "android/gradlew" ] || [ ! -f "android/settings.gradle" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Incomplete android directory detected. Generating complete Android platform with Capacitor..."
            rm -rf android
            npx cap add android
          fi

          # Ensure SDK 35 compatibility (avoid SDK 36 preview errors)
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = 36/compileSdkVersion = 35/g' android/variables.gradle
            sed -i 's/targetSdkVersion = 36/targetSdkVersion = 35/g' android/variables.gradle
          fi

          # Ensure lightweight bin distribution and connection timeout
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/-all.zip/-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
            if ! grep -q "networkTimeout" android/gradle/wrapper/gradle-wrapper.properties; then
              echo "networkTimeout=60000" >> android/gradle/wrapper/gradle-wrapper.properties
            fi
          fi

          # Ensure safe google-services check
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/servicesJSON.text/servicesJSON.exists()/g' android/app/build.gradle
          fi

          # Synchronize web assets
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK for Release
        run: |
          mkdir -p release-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found compiled APK at: $APK_FILE"
          cp "$APK_FILE" release-output/XstreamPad-Xbox-Roblox.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XstreamPad-Xbox-Roblox-APK
          path: release-output/XstreamPad-Xbox-Roblox.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ format('XstreamPad Xbox Controller APK v1.0.{0}', github.run_number) }}
          body: |
            ### 🎮 XstreamPad - Xbox Style Controller for Airtel Xstream & Roblox TV
            
            Download the Android APK below and install it directly on your Android phone!
            
            #### 📦 Download:
            - **`XstreamPad-Xbox-Roblox.apk`** (Ready to install on Android phones)
            
            #### ✨ Highlights:
            - **Auto-Rotates to Landscape**: Immediately locks into landscape mode on launch.
            - **Authentic Xbox Controller Layout**: Asymmetric thumbsticks, Xbox colored ABXY buttons, Xbox Guide/Nexus button, View & Menu buttons.
            - **Roblox Obby Ready**: Dedicated A/Spacebar jump, camera orbit right stick, inventory, and quick emote wheel.
            - **Ultra-low Latency**: Direct WebRTC / WebSocket link to your Airtel Xstream TV box.
            - **Tactile Rumble**: Mechanical click audio feedback and multi-pulse haptics.
          files: release-output/XstreamPad-Xbox-Roblox.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
