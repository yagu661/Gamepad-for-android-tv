name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Xbox Controller APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Set Android Permissions for Gamepad & Networking
        run: |
          # Inject full screen, wake lock and vibration permissions into AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST_PATH"
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and Prepare APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/XstreamPad-Xbox-Roblox.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XstreamPad-Xbox-Roblox-APK
          path: release-output/XstreamPad-Xbox-Roblox.apk
          if-no-files-found: error

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ format('XstreamPad Xbox Controller APK v1.0.{0}', github.run_number) }}
          body: |
            ### 🎮 XstreamPad - Xbox Style Controller for Airtel Xstream & Roblox TV
            
            Download the Android APK below and install it directly on your Android phone!
            
            #### 📦 Download:
            - **`XstreamPad-Xbox-Roblox.apk`** (Ready to install on Android phones)
            
            #### ✨ Highlights:
            - **Authentic Xbox Controller Layout**: Asymmetric thumbsticks, Xbox colored ABXY buttons, Xbox Guide/Nexus button, View & Menu buttons.
            - **Roblox Obby Ready**: Dedicated A/Spacebar jump, camera orbit right stick, inventory, and quick emote wheel.
            - **Ultra-low Latency**: Direct WebRTC / WebSocket link to your Airtel Xstream TV box.
            - **Tactile Rumble**: Mechanical click audio feedback and multi-pulse haptics.
          files: release-output/XstreamPad-Xbox-Roblox.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
